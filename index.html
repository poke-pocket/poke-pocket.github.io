<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>POKé POCKET · 掌上像素宝可梦</title>
    <meta name="description" content="3D 像素风原野冒险与复古掌机养成、编队、图鉴、地图一体化的浏览器宝可梦游戏" />
    <meta name="theme-color" content="#7950f2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="POKé POCKET" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      html, body { margin: 0; padding: 0; background: #14121d; overflow: hidden; image-rendering: pixelated; }
      #pokeball-boot-curtain {
        position: fixed;
        inset: 0;
        z-index: 99999;
        pointer-events: auto;
        overflow: hidden;
        font-family: "Press Start 2P", "PingFang SC", "Microsoft YaHei", monospace;
        image-rendering: pixelated;
      }
      #pokeball-boot-curtain.is-opening { pointer-events: none; }
      #pokeball-boot-curtain .pb-boot-top,
      #pokeball-boot-curtain .pb-boot-bottom {
        position: absolute;
        left: 0;
        right: 0;
        height: 50%;
        will-change: transform;
        transition: transform 0.42s steps(14, end);
      }
      /* Pure axis-aligned 6x6px 2-stage Bayer pixel dithering (ZERO smooth gradients or diagonal anti-aliasing!) */
      #pokeball-boot-curtain .pb-boot-top {
        top: 0;
        background-color: #e03131;
        border-bottom: 12px solid #14121d;
        box-sizing: border-box;
      }
      #pokeball-boot-curtain .pb-boot-top::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 54px;
        background-image:
          linear-gradient(#ff6b6b, #ff6b6b),
          repeating-conic-gradient(transparent 0% 25%, #ff5252 0% 50%),
          repeating-conic-gradient(transparent 0% 25%, #ff5252 0% 50%),
          conic-gradient(at 6px 6px, transparent 270deg, #ff5252 270deg);
        background-size: 100% 18px, 12px 12px, 12px 12px, 12px 12px;
        background-position: 0 0, 0 18px, 0 30px, 0 42px;
        background-repeat: no-repeat, repeat-x, repeat-x, repeat-x;
      }
      #pokeball-boot-curtain .pb-boot-top::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 54px;
        background-image:
          conic-gradient(at 6px 6px, transparent 270deg, #b02525 270deg),
          repeating-conic-gradient(#b02525 0% 25%, transparent 0% 50%),
          repeating-conic-gradient(#b02525 0% 25%, transparent 0% 50%),
          linear-gradient(#b02525, #b02525),
          linear-gradient(#7d1515, #7d1515);
        background-size: 12px 12px, 12px 12px, 12px 12px, 100% 12px, 100% 6px;
        background-position: 0 0, 0 12px, 0 24px, 0 36px, 0 48px;
        background-repeat: repeat-x, repeat-x, repeat-x, no-repeat, no-repeat;
      }
      #pokeball-boot-curtain .pb-boot-sheen {
        position: absolute;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
        width: min(300px, 60vw);
        height: 12px;
        background: #ffc9c9;
        box-shadow:
          -12px 6px 0 #ffa8a8,
          12px 6px 0 #ffa8a8,
          -24px 6px 0 #ff8787,
          24px 6px 0 #ff8787;
        z-index: 2;
      }
      #pokeball-boot-curtain .pb-boot-socket {
        position: absolute;
        left: 50%;
        bottom: -12px;
        transform: translateX(-50%);
        width: 132px;
        height: 66px;
        z-index: 3;
      }
      #pokeball-boot-curtain .pb-boot-bottom {
        bottom: 0;
        background-color: #f1f3f5;
        border-top: 12px solid #14121d;
        box-sizing: border-box;
      }
      #pokeball-boot-curtain .pb-boot-bottom::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 42px;
        background-image:
          linear-gradient(#ffffff, #ffffff),
          repeating-conic-gradient(#ffffff 0% 25%, transparent 0% 50%),
          conic-gradient(at 6px 6px, transparent 270deg, #ffffff 270deg);
        background-size: 100% 18px, 12px 12px, 12px 12px;
        background-position: 0 0, 0 18px, 0 30px;
        background-repeat: no-repeat, repeat-x, repeat-x;
      }
      #pokeball-boot-curtain .pb-boot-bottom::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 60px;
        background-image:
          conic-gradient(at 6px 6px, transparent 270deg, #ced4da 270deg),
          repeating-conic-gradient(#ced4da 0% 25%, transparent 0% 50%),
          repeating-conic-gradient(#ced4da 0% 25%, transparent 0% 50%),
          linear-gradient(#ced4da, #ced4da),
          linear-gradient(#adb5bd, #adb5bd);
        background-size: 12px 12px, 12px 12px, 12px 12px, 100% 16px, 100% 8px;
        background-position: 0 0, 0 12px, 0 24px, 0 36px, 0 52px;
        background-repeat: repeat-x, repeat-x, repeat-x, no-repeat, no-repeat;
      }
      #pokeball-boot-curtain .pb-boot-clasp {
        position: absolute;
        left: 50%;
        top: -66px;
        transform: translateX(-50%);
        width: 132px;
        height: 132px;
        z-index: 4;
        filter: drop-shadow(0 6px 0 #ced4da);
      }
      #pokeball-boot-curtain .pb-boot-core-base {
        fill: #ff4d4d;
        animation: pbBootPxCore 0.55s steps(2, end) infinite;
      }
      #pokeball-boot-curtain .pb-boot-core-shade {
        fill: #c92a2a;
      }
      #pokeball-boot-curtain.is-ready .pb-boot-core-base {
        animation: none;
        fill: #51cf66;
      }
      #pokeball-boot-curtain.is-ready .pb-boot-core-shade {
        fill: #2b8a3e;
      }
      #pokeball-boot-curtain .pb-boot-hud {
        position: absolute;
        left: 50%;
        top: 82px;
        transform: translateX(-50%);
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        background: #14121d;
        border: 4px solid #14121d;
        outline: 2px solid #ffe066;
        outline-offset: -6px;
        box-shadow: 6px 6px 0 #adb5bd;
        color: #fff9db;
        white-space: nowrap;
      }
      #pokeball-boot-curtain .pb-boot-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 900;
      }
      #pokeball-boot-curtain .pb-boot-tag {
        padding: 2px 5px;
        background: #e03131;
        color: #ffffff;
        font-size: 9px;
        letter-spacing: 1px;
      }
      #pokeball-boot-curtain .pb-boot-bars {
        display: flex;
        gap: 4px;
      }
      #pokeball-boot-curtain .pb-boot-bars i {
        width: 14px;
        height: 8px;
        background: #2b283a;
        display: block;
        animation: pbBootSeg 0.8s steps(1, end) infinite;
      }
      #pokeball-boot-curtain .pb-boot-bars i:nth-child(1) { animation-delay: 0s; }
      #pokeball-boot-curtain .pb-boot-bars i:nth-child(2) { animation-delay: 0.1s; }
      #pokeball-boot-curtain .pb-boot-bars i:nth-child(3) { animation-delay: 0.2s; }
      #pokeball-boot-curtain .pb-boot-bars i:nth-child(4) { animation-delay: 0.3s; }
      #pokeball-boot-curtain .pb-boot-bars i:nth-child(5) { animation-delay: 0.4s; }
      #pokeball-boot-curtain .pb-boot-bars i:nth-child(6) { animation-delay: 0.5s; }
      #pokeball-boot-curtain .pb-boot-bars i:nth-child(7) { animation-delay: 0.6s; }
      #pokeball-boot-curtain .pb-boot-bars i:nth-child(8) { animation-delay: 0.7s; }
      #pokeball-boot-curtain.is-ready .pb-boot-bars i {
        animation: none;
        background: #51cf66;
      }
      #pokeball-boot-curtain.is-opening .pb-boot-top {
        transform: translate3d(0, -116%, 0);
      }
      #pokeball-boot-curtain.is-opening .pb-boot-bottom {
        transform: translate3d(0, calc(100% + 90px), 0);
      }
      @keyframes pbBootPxCore {
        0% { fill: #ff4d4d; }
        50% { fill: #ffd43b; }
        100% { fill: #ff4d4d; }
      }
      @keyframes pbBootSeg {
        0%, 49% { background: #ffd43b; }
        50%, 100% { background: #2b283a; }
      }
    </style>
  </head>
  <body>
    <div id="pokeball-boot-curtain" aria-label="正在加载游戏">

        <div class="pb-boot-sheen"></div>
        <svg class="pb-boot-socket" viewBox="0 0 24 12" shape-rendering="crispEdges">
          <rect x="6" y="0" width="12" height="1" fill="#9e1f1f" />
          <rect x="4" y="1" width="2" height="1" fill="#9e1f1f" />
          <rect x="18" y="1" width="2" height="1" fill="#9e1f1f" />
          <rect x="2" y="2" width="2" height="2" fill="#9e1f1f" />
          <rect x="20" y="2" width="2" height="2" fill="#9e1f1f" />
          <rect x="7" y="1" width="10" height="1" fill="#14121d" />

          <rect x="2" y="3" width="20" height="18" fill="#14121d" />

        </svg>
        <div class="pb-boot-hud">
          <div class="pb-boot-row">
            <span class="pb-boot-tag">LOADING</span>
            <span>正在构筑像素世界…</span>
          </div>
          <div class="pb-boot-bars">
            <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
          </div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      window.setTimeout(function () {
        var el = document.getElementById('pokeball-boot-curtain');
        if (el) { el.classList.add('is-opening'); window.setTimeout(function () { el.remove(); }, 600); }
      }, 6500);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
